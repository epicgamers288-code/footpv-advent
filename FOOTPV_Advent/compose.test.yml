name: footpv-advent-rehearsal
services:
  db:
    image: postgres:18-alpine
    environment: {POSTGRES_DB: advent_test, POSTGRES_USER: rehearsal, POSTGRES_PASSWORD: localonly}
    volumes: [test_db:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U rehearsal -d advent_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: {context: ./server, args: {FEATURES: rehearsal}}
    environment: {DATABASE_URL: "postgres://rehearsal:localonly@db/advent_test", ADMIN_IDS: "1", EVENT_YEAR: "2026"}
    depends_on: {db: {condition: service_healthy}}
  web:
    build: ./web
    environment: {PUBLIC_HOST: ":80"}
    ports: ["127.0.0.1:8091:80"]
    depends_on: [api]
volumes: {test_db: {}}
