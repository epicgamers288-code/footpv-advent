services:
  - type: web
    name: footpv-advent
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: footpv-advent-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: EVENT_YEAR
        value: "2026"
databases:
  - name: footpv-advent-db
    databaseName: footpv_advent
    user: footpv
    region: frankfurt
    plan: free
    ipAllowList: []
